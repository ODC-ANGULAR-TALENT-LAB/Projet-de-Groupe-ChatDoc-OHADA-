  <!-- Préchargement des deux polices présentes sur TOUTE page :
       Figtree pour l'interface, Fraunces pour les titres et
       les références d'articles. Sans cela, le navigateur ne les
       découvre qu'après avoir analysé la feuille de style, et le texte

       Ce sont des polices VARIABLES : un seul fichier par famille porte
       toutes les graisses. Précharger le sous-ensemble latin suffit ;
       le latin étendu arrive à la demande, via unicode-range. -->
  <link rel="preload" as="font" type="font/woff2" crossorigin
        href="polices/figtree-400-700-latin.woff2">
  <link rel="preload" as="font" type="font/woff2" crossorigin
        href="polices/fraunces-400-700-latin.woff2">
</head>
