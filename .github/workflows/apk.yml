# Construit l'APK Android et le publie en release.
#
# POURQUOI UNE RELEASE ET NON UN ARTIFACT. Les artifacts d'Actions ne
# sont telechargeables qu'en etant connecte a GitHub : un bandeau public
# pointant dessus enverrait les visiteurs sur une page de connexion. Les
# assets de release, sur un depot public, se telechargent sans compte et
# ne disparaissent pas au bout de 90 jours.
#
# L'URL du bandeau ne change jamais :
#   .../releases/latest/download/chatdocs-ohada.apk

name: APK Android

on:
  workflow_dispatch:
    inputs:
      url_application:
        description: "URL du site a ouvrir (vide = variable URL_APPLICATION)"
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write # necessaire pour creer la release

jobs:
  construire:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: SDK Android
        uses: android-actions/setup-android@v3

      # L'URL vient, par ordre de priorite : de la saisie manuelle, de la
      # variable de depot, puis d'un defaut. On la resout ICI plutot que
      # dans Gradle : le journal doit dire sur quelle URL l'APK a ete
      # construit, sinon un APK qui ouvre le mauvais site est
      # indiscernable d'un APK correct.
      - name: Determiner l'URL
        id: url
        run: |
          URL="${{ inputs.url_application }}"
          if [ -z "$URL" ]; then URL="${{ vars.URL_APPLICATION }}"; fi
          if [ -z "$URL" ]; then URL="https://chatdocs-ohada.vercel.app"; fi
          echo "valeur=$URL" >> "$GITHUB_OUTPUT"
          echo "### APK construit pour $URL" >> "$GITHUB_STEP_SUMMARY"

      # LA SIGNATURE N'EST PLUS OPTIONNELLE.
      #
      # Depuis le passage en Trusted Web Activity, Android compare
      # l'empreinte du certificat de l'APK a celle declaree par le site
      # dans /.well-known/assetlinks.json. Une cle de debogage — engendree
      # differemment sur chaque machine — ne peut correspondre a rien :
      # l'application s'ouvrirait avec la barre d'adresse de Chrome, ce
      # qui est exactement ce que la TWA sert a eviter.
      #
      # On s'arrete donc franchement plutot que de publier un APK qui
      # PARAIT fonctionner tout en ayant perdu son interet.
      - name: Verifier la cle de signature
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 absent. Une Trusted Web"
            echo "::error::Activity exige une cle stable : sans elle, le domaine"
            echo "::error::ne peut pas verifier l'application et la barre"
            echo "::error::d'adresse reste affichee. Voir le README, section"
            echo "::error::« Application Android »."
            exit 1
          fi

      - name: Preparer le magasin de cles
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/cle.jks"
          echo "ANDROID_KEYSTORE_CHEMIN=$RUNNER_TEMP/cle.jks" >> "$GITHUB_ENV"

      - name: Construire
        working-directory: mobile
        env:
          ANDROID_KEYSTORE_CHEMIN: ${{ env.ANDROID_KEYSTORE_CHEMIN }}
          ANDROID_KEYSTORE_MOT_DE_PASSE: ${{ secrets.ANDROID_KEYSTORE_MOT_DE_PASSE }}
          ANDROID_CLE_ALIAS: ${{ secrets.ANDROID_CLE_ALIAS }}
          ANDROID_CLE_MOT_DE_PASSE: ${{ secrets.ANDROID_CLE_MOT_DE_PASSE }}
        run: |
          gradle assembleRelease -PurlApplication="${{ steps.url.outputs.valeur }}" --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../chatdocs-ohada.apk

      # L'EMPREINTE EST LUE DANS L'APK CONSTRUIT, jamais saisie a la main.
      #
      # C'est le seul moyen d'etre certain qu'elle correspond a ce qui est
      # reellement publie. Une empreinte recopiee dans un fichier se
      # desynchronise au premier changement de cle, et le symptome — une
      # barre d'adresse qui reapparait — ne designe pas sa cause.
      - name: Extraire l'empreinte et publier assetlinks.json
        id: empreinte
        run: |
          SHA=$("$ANDROID_HOME/build-tools/34.0.0/apksigner" verify                   --print-certs chatdocs-ohada.apk                 | grep -i "SHA-256 digest" | head -1                 | sed 's/.*: *//'                 | tr -d ' ' | tr 'a-f' 'A-F'                 | sed 's/../&:/g; s/:$//')
          if [ -z "$SHA" ]; then
            echo "::error::Empreinte SHA-256 introuvable dans l'APK signe."
            exit 1
          fi
          echo "  empreinte : $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

          mkdir -p frontend/public/.well-known
          cat > frontend/public/.well-known/assetlinks.json <<JSON
          [
            {
              "relation": ["delegate_permission/common.handle_all_urls"],
              "target": {
                "namespace": "android_app",
                "package_name": "cm.chatdocs.ohada",
                "sha256_cert_fingerprints": ["$SHA"]
              }
            }
          ]
          JSON
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**APK signe en release.** Empreinte \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"

      # LE SITE SERT L'APK LUI-MEME, et ce fichier doit donc suivre
      # chaque construction. Le lien du bandeau pointait auparavant vers
      # la release : deux redirections vers un domaine tiers et une URL
      # signee expirant en une heure, ce qui faisait echouer le
      # telechargement sur reseau mobile.
      #
      # La release reste publiee ci-dessous — elle sert de miroir et de
      # trace de version — mais elle n'est plus le chemin que suivent
      # les visiteurs.
      - name: Deposer l'APK dans le site
        run: |
          cp chatdocs-ohada.apk frontend/public/chatdocs-ohada.apk
          if git diff --quiet -- frontend/public/chatdocs-ohada.apk frontend/public/.well-known/assetlinks.json; then
            echo "APK identique a celui deja publie : rien a commiter."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/chatdocs-ohada.apk frontend/public/.well-known/assetlinks.json
          # Le workflow ne se declenche que manuellement ou sur un tag :
          # ce commit ne peut donc pas le relancer en boucle. Il declenche
          # en revanche le redeploiement du site, ce qui est le but.
          git commit -m "APK : mettre a jour le fichier et son empreinte"
          git push

      - name: Publier
        uses: softprops/action-gh-release@v2
        with:
          # Un tag date pour les declenchements manuels : deux
          # constructions le meme jour ne doivent pas se recouvrir.
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('apk-{0}', github.run_number) }}
          name: ChatDocs OHADA — application Android
          body: |
            Application Android de ChatDocs OHADA.

            Elle ouvre **${{ steps.url.outputs.valeur }}**. Une correction
            du site profite immediatement a l'application, sans republier
            d'APK.

            **Installation.** Android affichera un avertissement
            « source inconnue » : c'est normal pour un APK distribue hors
            du Play Store. Autorisez l'installation depuis votre
            navigateur, puis ouvrez le fichier telecharge.

            Signature : release, empreinte `${{ steps.empreinte.outputs.sha }}`
          files: chatdocs-ohada.apk
          make_latest: true
