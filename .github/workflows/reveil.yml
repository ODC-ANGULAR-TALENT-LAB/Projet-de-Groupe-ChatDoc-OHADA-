# Renfort pour garder l'API eveillee.
#
# POURQUOI. Un service web de l'offre gratuite de Render s'endort apres
# 15 minutes sans requete, et le reveil prend environ une minute. Le
# visiteur qui arrive le premier attend donc devant une page qui semble
# figee — et c'est exactement ce qui se produit devant un jury.
#
# CE N'EST QU'UN RENFORT. La sonde principale est EXTERNE (UptimeRobot,
# toutes les 5 minutes, voir le README). Les taches planifiees de GitHub
# sont retardees, voire sautees, quand la plateforme est chargee : sur
# l'historique de ce fichier, 34 passages par jour au mieux pour 108
# prevus. Et GitHub desactive les planifications d'un depot sans
# activite pendant 60 jours. Seule, cette tache ne tient pas l'API
# eveillee ; en renfort, elle couvre les trous de la sonde.
#
# /vie ET NON /sante. /vie ne touche pas la base : Neon peut s'endormir
# entre deux visites, ce qui la garde dans son quota de calcul gratuit.
#
# 24 HEURES SUR 24. Eveillee en permanence, l'API consomme au plus
# 744 heures par mois, sous les 750 que Render offre par espace de
# travail — a condition qu'elle soit le seul service web gratuit.
#
# CE QUE CE FICHIER N'A PAS VU. Du 20 septembre au 14 octobre 2026,
# chacun de ses passages a echoue : la base Render avait expire. Les
# echecs restaient dans l'onglet Actions, que personne ne regardait. La
# sonde externe, elle, envoie un courriel.

name: Reveil de l'API

on:
  schedule:
    # Toutes les 10 minutes, jour et nuit.
    - cron: "*/10 * * * *"
  # Permet de reveiller l'API a la demande, juste avant une
  # demonstration, sans attendre le prochain passage.
  workflow_dispatch:

jobs:
  appeler:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler /vie
        env:
          # Variable du depot : Settings > Secrets and variables >
          # Actions > Variables. Exemple :
          #   URL_API = https://chatdocs-api.onrender.com
          URL_API: ${{ vars.URL_API }}
        run: |
          if [ -z "$URL_API" ]; then
            echo "La variable de depot URL_API n'est pas definie : rien a appeler."
            echo "Renseignez-la une fois le service cree sur Render."
            exit 0
          fi

          # --max-time 90 : un service endormi met environ une minute a
          # repondre. Un delai plus court ferait echouer precisement
          # l'appel qui remplit son office.
          #
          # --retry 3 : une erreur passagere ne doit pas declencher
          # d'alerte. En revanche, trois echecs consecutifs signalent
          # une vraie panne, et l'echec du job est alors utile.
          code=$(curl --silent --show-error --location \
                      --max-time 90 --retry 3 --retry-delay 10 \
                      --output /dev/null --write-out "%{http_code}" \
                      "${URL_API%/}/vie")

          echo "GET ${URL_API%/}/vie -> $code"
          case "$code" in
            2*) echo "API eveillee." ;;
            *)  echo "::error::L'API ne repond pas correctement (code $code)."; exit 1 ;;
          esac
